name: Core Build Pipeline

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 350

    steps:
      - name: 1. Restore Workspace Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/Desktop
            ~/Documents
            ~/work
          key: ssh-macos-data-${{ github.run_number }}
          restore-keys: |
            ssh-macos-data-

      - name: 2. Execute Build Script
        env:
          CORE_INIT: ${{ secrets.CORE_INIT }}
        run: |
          echo "Initializing environment..."
          eval "$CORE_INIT"
          echo "Running tests..."
          sleep 19800
